{% extends "base.html" %}
{% block contenido %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-8">
        <h1 class="display-4 fw-bold">💞 Usue Encuentros</h1>
        <p class="lead text-muted mt-3">Conectando personas con respeto, confianza y cariño ✨</p>
        <div class="mt-5">
            {% if session.usuario %}
                <a href="{{ url_for('perfil') }}" class="btn btn-primary btn-lg">Ver mi perfil</a>
                <a href="{{ url_for('buscar') }}" class="btn btn-success btn-lg ms-2">Buscar personas</a>
            {% else %}
                <a href="{{ url_for('registro') }}" class="btn btn-primary btn-lg">Crear cuenta</a>
                <a href="{{ url_for('login') }}" class="btn btn-outline-dark btn-lg ms-2">Iniciar sesión</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
