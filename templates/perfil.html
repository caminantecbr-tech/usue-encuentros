{% extends "base.html" %}
{% block contenido %}
<div class="row justify-content-center">
<div class="col-md-8">
<h2 class="mb-4">Mi Perfil 💖</h2>
<div class="card mb-4">
<div class="card-body">
<h5 class="card-title">{{ usuario.nickname }}</h5>
<p class="card-text text-muted">Tipo: {{ usuario.tipo.title() }}</p>
                {% if usuario.foto %}
<img src="{{ url_for('static', filename='fotos/' + usuario.foto) }}" class="rounded-circle mb-3" width="150" alt="Foto de perfil">
                {% endif %}
<p class="text-muted fst-italic">Tus datos personales se mantienen privados 🔒</p>
</div>
</div>

<div class="d-flex gap-3 flex-wrap">
<a href="{{ url_for('buscar') }}" class="btn btn-success">🔍 Buscar personas</a>
<a href="{{ url_for('suscripcion') }}" class="btn" style="background:linear-gradient(90deg,#9c27b0,#e94560);color:#fff;">💎 Mi Suscripción</a>
</div>
</div>
</div>
<!-- Aquí termina el botón Buscar perfiles -->
<div style="margin: 2rem 0;">
    <a href="/suscripcion" style="display:block; width:100%; padding:1.2rem; background:linear-gradient(90deg, #9c27b0, #e94560); color:#fff; text-align:center; border-radius:12px; font-weight:bold; text-decoration:none; font-size:1.15rem;">
        💎 Mi Suscripción
    </a>
</div>

<a href="/salir" style="color:#e94560;">Finalizar sesión</a>
{% endblock %}
